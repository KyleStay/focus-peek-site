name: Feature request
description: Suggest an improvement to Focus Peek
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What browsing workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Focus Peek to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
